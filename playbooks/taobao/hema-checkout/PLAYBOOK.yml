# taobao/hema-checkout — the 盒马 cart to ONE paid order; the last move
# of `hema-buy`, starting where its rounds end: the storefront's home.
name: hema-checkout
description: pay for the lines in the 盒马 (Hema) cart inside Taobao in ONE order
enabled: false  # rehearse on YOUR device, then enable
scope: local
inputs:
  lines:
    description: the cart lines to buy, one per line, with quantities

route:
  - page: hema-home

  - do: open-cart                 # the tab bar's 购物车, snapped to the top
    macro: hema-open-cart

  - page: hema-cart

  - do: nudge                     # the 全选 row sits under this phone's floating button
    macro: nudge

  - page: hema-cart

  - agent: tick
    prompt: prompts.store-tick
    tools: [tap, scroll]
    give: [landmarks.close, macros.nudge]
    never_tap:
      - ["去结算", "领券结算"]
      - "清空"
      - {label: ["提交订单", "立即支付", "免密支付"], within: bottom}
    returns:
      ticked: the lines now ticked, one per line, as the cart shows them
    limit: {calls: 10, scrolls: 4}
    think: low
    on_fail: stop

  - page: hema-cart

  - do: settle
    on_fail: stop
    macro: hema-settle

  - page: store-order

  - ask: confirm-pay
    approve: payment
    total_label: ["合计"]                       # 合计：￥… in the footer
    message: "盒马下单：\n{tick.ticked}\n合计 ¥{ask.total}（以屏幕读数为准）。回复 好的 确认支付，或 不用 取消。"
    yes: ["好的", "好", "可以", "确认"]
    no: ["不用", "不要", "取消", "算了"]
    denied: "好的，已取消付款，商品还留在购物车里。"
    wait: 45
    rounds: 3
    think: off
    on_fail: stop
    resume: foreground            # the ask left the app — come back where it was

  - do: pay
    irreversible: payment
    on_fail: handover             # money may have moved: the model verifies and reports
    macro: submit-order

  - page: paid

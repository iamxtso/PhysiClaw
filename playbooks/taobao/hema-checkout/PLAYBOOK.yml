# taobao/hema-checkout — the 盒马 cart to ONE paid order; the last move
# of `hema-buy`. Starts on the storefront's home, where the rounds end.
# Ends on the paid page.
name: hema-checkout
description: pay for the lines in the 盒马 (Hema) cart inside Taobao in ONE order
enabled: false  # rehearse on YOUR device, then enable
scope: local
inputs:
  lines:
    description: the cart lines to buy, one per line, with quantities

route:
  - page: app.pages.hema-home     # 盒马's home: 权益中心 over its own tab bar

  - do: open-cart                 # the tab bar's 购物车, then a stroke that snaps a
    macro: app.macros.hema-open-cart  # cart left scrolled back to its top

  - page: app.pages.hema-cart     # the 购物车 title over the footer's settle button

  - do: nudge                     # a short stroke up while the 全选 row sits under
    macro: app.macros.store-nudge  # this phone's floating button

  - page: app.pages.hema-cart

  - agent: tick
    prompt: app.prompts.store-tick  # the list, the checkbox geometry, the footer total
    tools: [tap, scroll]
    give: [app.landmarks.close, app.macros.store-nudge]   # a promo ✕, the stroke
    never_tap:
      - ["去结算", "领券结算"]
      - "清空"
      - {label: ["提交订单", "立即支付", "免密支付"], within: bottom}
    returns:
      ticked: the lines now ticked, one per line, as the cart shows them
    limit: {calls: 10, scrolls: 4}
    think: low
    on_fail: stop

  - page: app.pages.hema-cart

  - do: settle                    # 去结算 / 领券结算 in 盒马's footer, to the order page
    on_fail: stop                 # nothing is paid yet
    macro: app.macros.hema-settle

  - page: app.pages.store-order   # 确认订单 over 提交订单

  - ask: confirm-pay
    approve: payment
    total_label: ["合计"]                       # 合计：￥… in the footer
    message: "盒马下单：\n{tick.ticked}\n合计 ¥{ask.total}（以屏幕读数为准）。回复 好的 确认支付，或 不用 取消。"
    yes: ["好的", "好", "可以", "确认"]
    no: ["不用", "不要", "取消", "算了"]
    denied: "好的，已取消付款，商品还留在购物车里。"
    wait: 45
    rounds: 3
    think: off
    on_fail: stop
    resume: app.macros.foreground  # the ask left the app — come back where it was

  - do: pay                       # 提交订单, then the cashier's button when one shows
    irreversible: payment
    on_fail: handover             # money may have moved: the model verifies and reports
    macro: app.macros.submit-order

  - page: app.pages.paid

# taobao/buy-together.add — one item into the marketplace cart: search,
# pick, 加入购物车; run by `buy-together`, once per item.
# Starts anywhere (cold launch, the reset between rounds). Ends on the
# item page with the item in the cart.
kind: playbook
schema: 1
name: add
description: put one item in the 淘宝 (Taobao) cart by keyword, nothing paid
enabled: false  # rehearse on YOUR device, then enable
inputs:
  item:
    description: one product, name + spec + quantity, as the buyer named it
returns:
  line: "{pick.title} ×{pick.qty}  ¥{pick.price}"   # the cart line, as the buyer will read it

route:
  - agent: parse
    prompt: app.prompts.item-keyword  # the product words, no quantity or unit
    returns:
      keyword: the search keyword, exactly as it should be typed
    think: off

  - start: app
    macro: app.macros.launch      # to the feed: resumed as it is, else cold-launched

  - page: app.pages.home

  - do: search                    # type the keyword into the feed's bar, run it
    with: {keyword: "{parse.keyword} 非直播"}
    macro: app.macros.search

  - page: app.pages.results

  - agent: pick
    prompt: prompts.pick-to-cart  # rows to a listing, the sheet's spec and quantity, 加入购物车
    tools: [tap, scroll, back]
    give: [app.landmarks.close]       # the ✕ of a promo card over the page
    never_tap:
      - {label: ["立即购买", "领券购买"], within: bottom}
      - {label: ["免密支付", "立即支付", "提交订单"], within: bottom}
    returns:
      title: the listing title exactly as shown, the cart will show the same
      qty: the quantity set on the sheet, a number
      price: the unit price shown for the chosen spec, a number
    limit: {calls: 12, scrolls: 4}
    think: low
    on_fail: stop                 # alone, a pick that cannot finish ends the session;
                                  # under `miss: skip` the round is recorded as missed

  - page: app.pages.detail
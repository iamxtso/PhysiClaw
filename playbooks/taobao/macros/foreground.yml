name: foreground
description: bring Taobao back to the front where it was — an ask's resume hand, and launch's first move
# Disabled until rehearsed on YOUR device: physiclaw macros run taobao/foreground
enabled: false
steps:
  # Resumes, not cold: whatever Taobao kept (the sheet an ask left, a
  # feed, a mid-state page) is still up.
  - home_screen
  - tap: "blank area below the app cards"    # home_screen FROM home can open the switcher
    at: [0.42, 0.855, 0.58, 0.885]
  - tap: "the taobao app icon"
    at: [0.720, 0.425, 0.909, 0.551]
  - wait: 2

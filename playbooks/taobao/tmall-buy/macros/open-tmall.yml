kind: macro
name: open-tmall
description: open the 天猫超市闪购 store from the 闪购 search results for 天猫超市 — its card comes first
# Disabled until rehearsed on YOUR device: physiclaw macros run taobao/tmall-buy.open-tmall
enabled: false
steps:
  - tap: "天猫超市闪购"
    at: [0.15, 0.29, 0.70, 0.35]
    require: {text: "天猫超市闪购", within: [0.10, 0.27, 0.80, 0.37]}
    hint: "the first result is not the 天猫超市闪购 store — the results moved"
  - wait: 4
  # A welcome card covers the store on first open (恭喜获得 ¥26): its ✕ is
  # an icon below 开心收下 — tap it only while the card shows.
  - tap: "the ✕ under the store's welcome card"
    at: [0.44, 0.74, 0.56, 0.81]
    when: ["开心收下", "恭喜获得"]

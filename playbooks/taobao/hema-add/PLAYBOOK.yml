# taobao/hema-add — one item into the 盒马 cart; runs once per item
# under `hema-buy`, which enters the storefront first. Starts and ends
# on the storefront's home, so the rounds chain without a relaunch.
name: hema-add
description: put one item in the 盒马 (Hema) cart inside Taobao, nothing paid
enabled: false  # rehearse on YOUR device, then enable
scope: local
inputs:
  item:
    description: one product, name + spec + quantity, as the buyer named it
returns:
  line: "{pick.title} ×{pick.qty}  ¥{pick.price}"

route:
  - agent: parse
    prompt: taobao.prompts.item-keyword  # the product words, no quantity or unit
    returns:
      keyword: the search keyword, exactly as it should be typed
    think: off

  - page: hema-home               # 盒马's home: 权益中心 over its own tab bar

  - do: find                      # type the keyword into the storefront's search, run it
    with: {keyword: "{parse.keyword}"}
    macro: taobao.macros.store-search

  - page: store-results           # the store's sort row (综合排序 / 销量优先)

  - agent: pick
    prompt: taobao.prompts.store-pick  # rows to an item, one add, the sheets that follow
    tools: [tap, scroll]
    give: [landmarks.close, landmarks.pairing-close]   # a promo ✕, the 推荐搭配 sheet's ✕
    never_tap:
      - {label: ["去结算", "领券结算", "立即购买"], within: bottom}   # one target: the checkout button
      - {label: ["提交订单", "立即支付", "免密支付"], within: bottom}   # one target: the pay button
      - "凑单"
      - "换购"
    returns:
      title: the item title exactly as its page shows it
      qty: the quantity set, a number
      price: the unit price shown, a number
    limit: {calls: 12, scrolls: 4}
    think: low
    on_fail: stop

  - page: store-detail            # the item page: 加入购物车 and the 店铺 tab

  - do: back-to-store             # the item page's arrow, then the results' — lands on hema-home
    macro: taobao.macros.hema-back

  - page: hema-home
